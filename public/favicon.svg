<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <style>
    .bg { fill: #171717; }
    .fg { fill: #ffffff; }
    .muted { fill: #737373; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #ededed; }
      .fg { fill: #0a0a0a; }
      .muted { fill: #737373; }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="7" />
  <rect class="fg" x="7" y="7" width="8" height="8" rx="1.5" />
  <rect class="muted" x="17" y="7" width="8" height="8" rx="1.5" />
  <rect class="muted" x="7" y="17" width="8" height="8" rx="1.5" />
  <rect class="fg" x="17" y="17" width="8" height="8" rx="1.5" />
</svg>
